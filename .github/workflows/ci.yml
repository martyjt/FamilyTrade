name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  market-data:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: familytrade_test
          POSTGRES_PASSWORD: familytrade_test_password
          POSTGRES_DB: familytrade_ft05_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familytrade_test -d familytrade_ft05_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FAMILYTRADE_TEST_DATABASE_URL: postgresql+psycopg://familytrade_test:familytrade_test_password@127.0.0.1:5432/familytrade_ft05_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.3"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check src/familytrade/market_data tests/market_data migrations/versions/20260913_0002_ft05_market_data.py
      - run: uv run ruff format --check src/familytrade/market_data tests/market_data migrations/versions/20260913_0002_ft05_market_data.py
      - run: uv run ruff check src/familytrade/strategies tests/strategies src/familytrade/access/repository.py tests/access/test_identity_sessions.py src/familytrade/market_data/catalog.py tests/market_data/test_models_catalog.py migrations/versions/20260914_0003_ft06_strategy_definitions.py migrations/env.py tests/market_data/test_migrations.py
      - run: uv run ruff format --check src/familytrade/strategies tests/strategies src/familytrade/access/repository.py tests/access/test_identity_sessions.py src/familytrade/market_data/catalog.py tests/market_data/test_models_catalog.py migrations/versions/20260914_0003_ft06_strategy_definitions.py migrations/env.py tests/market_data/test_migrations.py
      - run: uv run mypy src
      - run: uv run pytest tests/market_data
      - run: uv run pytest tests/strategies/test_definitions.py

  access:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: familytrade_test
          POSTGRES_PASSWORD: familytrade_test_password
          POSTGRES_DB: familytrade_ft04_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U familytrade_test -d familytrade_ft04_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FAMILYTRADE_TEST_DATABASE_URL: postgresql+psycopg://familytrade_test:familytrade_test_password@127.0.0.1:5432/familytrade_ft04_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.3"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest tests/access

  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.3"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check --exclude docs/ft06-implementation-contract-v1.md .
      - run: uv run mypy src
      - run: uv run pytest tests/bootstrap
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test -- --run
      - run: npm --prefix frontend run build
      - run: docker compose config --quiet
      - run: docker compose up --build --detach
        if: matrix.os == 'ubuntu-latest'
      - run: curl --fail --retry 20 --retry-delay 3 --retry-all-errors --connect-timeout 5 --max-time 180 http://localhost:8000/health
        if: matrix.os == 'ubuntu-latest'
      - run: curl --fail --retry 20 --retry-delay 3 --retry-all-errors --connect-timeout 5 --max-time 180 http://localhost:5173
        if: matrix.os == 'ubuntu-latest'
      - run: docker build -t familytrade-bootstrap-check .
        if: matrix.os == 'ubuntu-latest'
      - run: docker compose down --volumes --remove-orphans
        if: always() && matrix.os == 'ubuntu-latest'
